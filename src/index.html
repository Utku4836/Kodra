<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="markdown-ui.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cli-terminal-ui</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div class="app">
      <!-- HEADER — trafik lambaları + klasör + model + göstergeler -->
      <header class="title-bar">
        <div class="traffic-lights">
          <button class="traffic-light red" id="btn-close" title="Close"><span class="icon">×</span></button>
          <button class="traffic-light yellow" id="btn-min" title="Minimize"><span class="icon">—</span></button>
          <button class="traffic-light green" id="btn-max" title="Maximize"><span class="icon">□</span></button>
        </div>
        <div class="path-wrap">
          <span class="path" id="path">~</span>
        </div>
        <div class="connection-state" id="connection-state" role="status" aria-live="polite" hidden>No internet</div>
      </header>

      <!-- CONTEXT ÇİZGİSİ — token doluluğu (2px) -->

      <!-- MAIN — kart akışı -->
      <main class="main-area">
        <div id="log" class="log"></div>
      </main>

      <!-- BOTTOM BAR — komut input -->
      <footer class="bottom-bar">
        <div class="command-area">
          <div class="command-dock">
            <div class="command-input-wrap">
              <span class="command-prompt" aria-hidden="true">›</span>
              <input
                type="text"
                class="command-input"
                id="cmd-input"
                placeholder="Type a command..."
                autocomplete="off"
                spellcheck="false"
                autofocus
              />
            </div>
            <div class="stream-actions" id="stream-actions" hidden>
              <button class="stream-stop" id="stream-stop" type="button" title="Stop response (Esc)" aria-label="Stop response">
                <span class="stream-stop-dot" aria-hidden="true"></span>
                <span class="stream-stop-label">working</span>
                <kbd>esc</kbd>
              </button>
            </div>
          </div>
          <div class="dock-meta">
            <button class="model-chip" id="model-chip" title="Select model">
              <span class="model-name" id="model-name">model</span>
            </button>
            <div class="ctx-status" id="ctx-status" data-state="ready" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span class="ctx-ring" id="ctx-fill" aria-hidden="true"></span>
            </div>
          </div>
        </div>
      </footer>

      <!-- SUGGEST PANEL — komut önerileri -->
      <div class="suggest-panel" id="suggest-panel" style="display: none;"></div>

      <!-- MODAL — model/provider/mod seçimi -->
      <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Selection menu" style="display: none;">
        <div class="modal-window">
          <div class="modal-search">
            <input type="text" class="modal-search-input" id="modal-search-input" placeholder="Search..." autocomplete="off" spellcheck="false" />
          </div>
          <div class="modal-list" id="modal-list"></div>
        </div>
      </div>

      <!-- SESSION DELETE CONFIRMATION -->
      <div class="modal confirm-modal" id="session-delete-modal" role="dialog" aria-modal="true" aria-labelledby="session-delete-title" aria-describedby="session-delete-description" style="display: none;">
        <div class="modal-window confirm-window">
          <div class="confirm-copy">
            <h2 id="session-delete-title">Delete conversation?</h2>
            <p id="session-delete-description"></p>
          </div>
          <div class="confirm-actions">
            <button type="button" class="confirm-button secondary" id="session-delete-cancel">Cancel</button>
            <button type="button" class="confirm-button danger" id="session-delete-confirm">Delete</button>
          </div>
        </div>
      </div>

      <!-- SESSION STATUS — konuşma geçmişine eklenmeyen sade durum menüsü -->
      <div class="modal status-modal" id="status-modal" role="dialog" aria-modal="true" aria-labelledby="status-title" style="display: none;">
        <section class="modal-window status-window">
          <header class="status-header">
            <div class="status-heading">
              <span class="status-provider" id="status-provider">Session</span>
              <h2 id="status-title">Model</h2>
            </div>
            <button class="status-close" id="status-close" type="button" aria-label="Close status">×</button>
          </header>
          <div class="status-content" id="status-content"></div>
        </section>
      </div>

      <!-- PROVIDER DIAGNOSTICS — oturum akışına yazılmayan sağlık görünümü -->
      <div class="modal diagnostics-modal" id="diagnostics-modal" role="dialog" aria-modal="true" aria-labelledby="diagnostics-title" style="display: none;">
        <section class="modal-window diagnostics-window">
          <header class="diagnostics-header">
            <div class="diagnostics-heading">
              <span class="diagnostics-provider" id="diagnostics-provider">Provider</span>
              <h2 id="diagnostics-title">Connection diagnostics</h2>
            </div>
            <div class="diagnostics-header-actions">
              <span class="diagnostics-overall" id="diagnostics-overall" data-state="checking">Checking</span>
              <button class="status-close" id="diagnostics-close" type="button" aria-label="Close diagnostics">×</button>
            </div>
          </header>
          <div class="diagnostics-content" id="diagnostics-content" aria-live="polite"></div>
          <footer class="diagnostics-actions">
            <button type="button" id="diagnostics-refresh">Refresh</button>
            <button type="button" id="diagnostics-deep">Deep test</button>
            <button type="button" id="diagnostics-copy">Copy report</button>
          </footer>
        </section>
      </div>

      <!-- API MODAL — API key girişi -->
      <div class="modal" id="api-modal" style="display: none;">
        <div class="modal-window api-window">
          <div class="api-provider-title" id="api-provider-title"></div>
          <div class="modal-api-field">
            <input type="password" class="modal-search-input" id="api-key-input" placeholder="Enter API key and press Enter..." autocomplete="new-password" spellcheck="false" />
          </div>
          <div class="custom-provider-fields" id="custom-provider-fields" style="display: none;">
            <label class="api-field-label" for="custom-base-url">Base URL</label>
            <input type="url" class="modal-search-input api-config-input" id="custom-base-url" placeholder="https://server.example/v1" autocomplete="off" spellcheck="false" />
            <label class="api-field-label" for="custom-model-id">Default model (optional)</label>
            <input type="text" class="modal-search-input api-config-input" id="custom-model-id" placeholder="model-id" autocomplete="off" spellcheck="false" />
            <div class="api-field-grid">
              <div>
                <label class="api-field-label" for="custom-protocol">Protocol</label>
                <select class="api-config-select" id="custom-protocol">
                  <option value="openai_chat">OpenAI Chat</option>
                  <option value="anthropic_messages">Anthropic Messages</option>
                  <option value="gemini_generate_content">Gemini GenerateContent</option>
                  <option value="ollama_openai">Ollama OpenAI</option>
                </select>
              </div>
              <div>
                <label class="api-field-label" for="custom-auth-scheme">Authentication</label>
                <select class="api-config-select" id="custom-auth-scheme">
                  <option value="bearer">Bearer</option>
                  <option value="x_api_key">x-api-key</option>
                  <option value="google_api_key">x-goog-api-key</option>
                  <option value="query_key">?key=</option>
                  <option value="none">None</option>
                </select>
              </div>
            </div>
            <details class="custom-advanced">
              <summary>Advanced connection settings</summary>
              <div class="custom-advanced-body">
                <div class="api-field-grid">
                  <div>
                    <label class="api-field-label" for="custom-models-path">Model endpoint</label>
                    <input type="text" class="modal-search-input api-config-input" id="custom-models-path" placeholder="models" autocomplete="off" spellcheck="false" />
                  </div>
                  <div>
                    <label class="api-field-label" for="custom-chat-path">Chat endpoint</label>
                    <input type="text" class="modal-search-input api-config-input" id="custom-chat-path" placeholder="chat/completions" autocomplete="off" spellcheck="false" />
                  </div>
                </div>
                <label class="api-field-label" for="custom-timeout">Timeout (5–120 seconds)</label>
                <input type="number" min="5" max="120" value="45" class="modal-search-input api-config-input" id="custom-timeout" />
                <label class="api-field-label" for="custom-headers">Secret headers — one Name: Value pair per line</label>
                <textarea class="api-config-textarea" id="custom-headers" rows="3" placeholder="X-Tenant: secret-value" autocomplete="off" spellcheck="false"></textarea>
                <label class="api-network-toggle">
                  <input type="checkbox" id="custom-allow-local" />
                  <span>Allow local/private network access</span>
                </label>
              </div>
            </details>
          </div>
          <div class="modal-api-meta">
            <span class="modal-api-subtext" id="api-key-subtext"></span>
            <span class="modal-api-error" id="api-key-error"></span>
          </div>
        </div>
      </div>

      <!-- APPROVAL MODAL — tool izin onayı -->
      <div class="modal" id="approval-modal" style="display: none;">
        <div class="modal-window approval-window">
          <div class="approval-header">
            <span class="approval-tool" id="appr-tool"></span>
            <span class="approval-risk" id="appr-risk"></span>
          </div>
          <div class="approval-detail" id="appr-detail"></div>
          <div class="approval-edit" id="appr-edit" style="display: none;">
            <textarea class="approval-edit-input" id="appr-edit-input" spellcheck="false" rows="4"></textarea>
          </div>
          <div class="approval-hint">
            [y] approve · [a] for session · [p] always · [n] deny · [e] edit · [Esc] cancel
          </div>
        </div>
      </div>

      <!-- ERROR OVERLAY -->
      <div class="err-overlay" id="err-overlay" style="display: none;"></div>
      <div class="status-toast" id="status-toast" role="status" aria-live="polite" hidden></div>
    </div>
  </body>
</html>
