<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cli-terminal-ui</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div class="app">
      <!-- TITLE BAR  macOS trafik lambalar1 + dinamik dizin yolu -->
      <header class="title-bar">
        <div class="traffic-lights">
          <button class="traffic-light red" id="btn-close" title="Kapat">
            <span class="icon">×</span>
          </button>
          <button class="traffic-light yellow" id="btn-min" title="Küçült">
            <span class="icon">—</span>
          </button>
          <button class="traffic-light green" id="btn-max" title="Tam ekran">
            <span class="icon">□</span>
          </button>
        </div>
        <div class="title-bar-center">
          <span class="path" id="path">~</span>
        </div>
        <div class="title-bar-right">
          <span class="token-label" id="token-label"></span>
          <span class="model-label" id="model-label"></span>
        </div>
      </header>

      <!-- MAIN AREA  Terminal �1kt1s1 -->
      <main class="main-area">
        <div id="terminal" class="terminal"></div>
      </main>

      <!-- SUGGEST PANEL  komut �nerileri (autocomplete) -->
      <div class="suggest-panel" id="suggest-panel" style="display: none;"></div>

      <!-- MODAL  model/provider se�im penceresi -->
      <div class="modal" id="modal" style="display: none;">
        <div class="modal-window">
          <div class="modal-search">
            <input
              type="text"
              class="modal-search-input"
              id="modal-search-input"
              placeholder="Ara..."
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div class="modal-list" id="modal-list"></div>
        </div>
      </div>

      <!-- API MODAL  API key giri_i -->
      <div class="modal" id="api-modal" style="display: none;">
        <div class="modal-window api-window">
          <div class="modal-api-field">
            <input
              type="password"
              class="modal-search-input"
              id="api-key-input"
              placeholder="API Key girin ve Enter'a bas1n..."
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div class="modal-api-meta">
            <span class="modal-api-subtext" id="api-key-subtext"></span>
            <span class="modal-api-error" id="api-key-error"></span>
          </div>
        </div>
      </div>

      <!-- APPROVAL MODAL — tool izin onayı -->
      <div class="modal" id="approval-modal" style="display: none;">
        <div class="modal-window approval-window">
          <div class="approval-header">
            <span class="approval-tool" id="appr-tool"></span>
            <span class="approval-risk" id="appr-risk"></span>
          </div>
          <div class="approval-detail" id="appr-detail"></div>
          <div class="approval-edit" id="appr-edit" style="display: none;">
            <textarea
              class="approval-edit-input"
              id="appr-edit-input"
              spellcheck="false"
              rows="4"
            ></textarea>
          </div>
          <div class="approval-hint">
            [y] onayla · [a] oturum için · [p] her zaman · [n] reddet · [e] düzenle · [Esc] iptal
          </div>
        </div>
      </div>

      <!-- BOTTOM BAR  Komut input -->
      <footer class="bottom-bar">
        <div class="command-input-wrap">
          <span class="command-prompt">></span>
          <input
            type="text"
            class="command-input"
            id="cmd-input"
            autocomplete="off"
            spellcheck="false"
            autofocus
          />
        </div>
      </footer>

      <!-- ERROR OVERLAY  hata olursa ekranda g�r�n�r (arka kap1) -->
      <div class="err-overlay" id="err-overlay" style="display: none;"></div>
    </div>
  </body>
</html>
