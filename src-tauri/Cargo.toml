[package]
name = "cli-terminal-ui"
version = "0.1.0"
description = "A keyboard-first desktop AI workspace with native tools and persistent sessions"
authors = ["Utku"]
repository = "https://github.com/Utku4836/cli-terminal-ui"
homepage = "https://github.com/Utku4836/cli-terminal-ui"
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cli_terminal_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
keyring = { version = "4.1.6", features = ["v1"] }
url = "2"
zeroize = "1.8"
